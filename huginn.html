<link rel="preconnect" href="https://fonts.googleapis.com">

<style>
:root{
--charcoal:#1E1E1E;--rune-grey:#2A2A2A;--rune-grey-2:#333333;
--orange:#FF6B00;--orange-hover:#FF8A33;--orange-press:#E05F00;
--silver:#A5ACAF;--verdigris:#4F7365;--verdigris-hover:#6B8F81;
--white:#F5F4F2;--black:#0D0D0D;
--danger:#E5484D;--success:#4F7365;--warning:#D9A441;--info:#5B8DB8;
--bg:#1E1E1E;--surface:#2A2A2A;--surface-2:#333333;--inset:#161616;--overlay:rgba(13,13,13,.72);
--border:#3D3D3D;--border-subtle:#2F2F2F;--border-strong:#54544f;
--text:#F2F1EE;--text-2:#A5ACAF;--text-3:#787E80;--text-disabled:#5C5F60;
--focus:rgba(255,107,0,.45);
--btn-hover:#3D3D3D;--btn-press:#262626;
--accent-text:var(--orange);--danger-dim:#dc2626;--danger-border:#7f1d1d;--danger-surface:#2e1616;--card-shadow:var(--sh-sm);
--display:'Cinzel',serif;--body:'Inter',-apple-system,BlinkMacSystemFont,sans-serif;--mono:'IBM Plex Mono',ui-monospace,monospace;
--r-sm:4px;--r-md:6px;--r-lg:8px;--r-xl:10px;
--sh-sm:0 1px 2px rgba(0,0,0,.35);--sh-md:0 4px 12px rgba(0,0,0,.4);--sh-lg:0 12px 32px rgba(0,0,0,.5);
--ease:cubic-bezier(.4,0,.2,1);--dur:180ms;
}
/* Light theme — token values and rules copied from asgard apps/platform/src/index.css
   (YD-568, merged 1833e66): ground #ebe6dd, white card, 3:1 border, no card shadow,
   orange-as-text aliased to the darker shade, sidebar pinned dark (see .side). */
:root[data-theme="light"]{
--bg:#ebe6dd;--surface:#ffffff;--surface-2:#f0ece5;--inset:#f7f4ef;--overlay:rgba(30,30,30,.45);
--border:#847e71;--border-subtle:#d9d3c8;--border-strong:#68655e;
--text:#1e1e1e;--text-2:#55524c;--text-3:#68655e;--text-disabled:#a8a196;--white:#ffffff;
--verdigris:#2f6b4f;--verdigris-hover:#3d8264;--success:#2f6b4f;
--accent-text:#993d00;--warning:#8a5a00;
--danger:#b3261e;--danger-dim:#8a1c15;--danger-border:#b3564c;--danger-surface:#f9ded9;
--btn-hover:#e6e1d8;--btn-press:#d9d3c8;--card-shadow:none;
--sh-md:0 4px 12px rgba(0,0,0,.10);--sh-lg:0 12px 32px rgba(0,0,0,.14);
}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--text);font-family:var(--body);font-size:15px;line-height:1.55}
a{color:var(--accent-text)}
button{font:inherit;color:inherit;cursor:pointer}
input,select,textarea{font:inherit;color:var(--text);background:var(--inset);border:1px solid var(--border);border-radius:var(--r-md);padding:10px 12px;width:100%;outline:none;transition:border-color var(--dur) var(--ease)}
input:focus,select:focus,textarea:focus{border-color:var(--orange);box-shadow:0 0 0 3px var(--focus)}
select{appearance:none;background-image:linear-gradient(45deg,transparent 50%,var(--silver) 50%),linear-gradient(135deg,var(--silver) 50%,transparent 50%);background-position:calc(100% - 18px) 50%,calc(100% - 13px) 50%;background-size:5px 5px;background-repeat:no-repeat;padding-right:36px}
textarea{min-height:88px;resize:vertical}
label{display:block;font-size:13px;color:var(--text-2);margin-bottom:6px;font-weight:500}
.field{margin-bottom:16px}
.row{display:grid;grid-template-columns:1fr 1fr;gap:16px}
@media(max-width:700px){.row{grid-template-columns:1fr}}
.hint{font-size:12px;color:var(--text-3);margin-top:6px}

/* layout */
.app{display:grid;grid-template-columns:220px 1fr;min-height:100vh}
.side{background:var(--inset);border-right:1px solid var(--border);padding:20px 16px;display:flex;flex-direction:column;gap:6px;position:sticky;top:0;height:100vh;height:100dvh;overflow-y:auto;overscroll-behavior:contain;
 /* pinned to dark in both themes (asgard .site-navbar): the dark wordmark stays correct here and no on-light logo is needed */
 --bg:#1E1E1E;--surface:#2A2A2A;--surface-2:#333333;--inset:#161616;--border:#3D3D3D;--border-subtle:#2F2F2F;--border-strong:#54544f;
 --text:#F2F1EE;--text-2:#A5ACAF;--text-3:#787E80;--white:#F5F4F2;--verdigris:#4F7365;--verdigris-hover:#6B8F81;--accent-text:#FF6B00;--btn-hover:#3D3D3D;--btn-press:#262626;color:var(--text)}
.theme{padding:4px 8px 8px}
.theme .lbl{font-size:11px;text-transform:uppercase;letter-spacing:.12em;color:var(--text-3);margin-bottom:6px}
.theme .seg{display:flex;border:1px solid var(--border);border-radius:var(--r-md);overflow:hidden}
.theme .seg button{flex:1;background:transparent;border:0;padding:6px 0;font-size:12px;color:var(--text-2)}
.theme .seg button+button{border-left:1px solid var(--border)}
.theme .seg button.on{background:var(--surface-2);color:var(--text);font-weight:600}
/* Mobile: the sidebar becomes a sticky top bar. Declared after every .side rule so it wins the cascade. */
@media(max-width:900px){
 .app{grid-template-columns:1fr}
 .side{position:sticky;top:0;z-index:5;height:auto;overflow:visible;display:grid;grid-template-columns:1fr auto;grid-template-areas:"brand new" "nav nav";gap:8px 12px;padding:10px 12px;border-right:0;border-bottom:1px solid var(--border);box-shadow:0 2px 8px rgba(0,0,0,.25)}
 .side .brand{grid-area:brand;padding:0;min-width:0}
 .side #btn-new{grid-area:new;padding:7px 12px;font-size:13px}
 .side #btn-new kbd{display:none}
 .side nav{grid-area:nav;flex-direction:row;overflow-x:auto;gap:4px;margin:0 -12px;padding:0 12px;scrollbar-width:none}
 .side nav::-webkit-scrollbar{display:none}
 .side nav a{padding:7px 10px}
 .side .spacer,.side .status,.side .theme{display:none}
}
.brand{display:flex;align-items:center;gap:10px;padding:4px 6px 18px;white-space:nowrap}
.brand .mark{width:32px;height:32px;flex:none}
.brand .wm{display:flex;flex-direction:column;line-height:1.1;min-width:0}
.brand .wm .name{font-family:var(--display);font-weight:600;font-size:18px;letter-spacing:.06em;color:var(--white)}
.brand .wm .by{font-size:10px;letter-spacing:.12em;text-transform:uppercase;color:var(--text-3);margin-top:3px}
.madeby{display:flex;align-items:center;gap:8px;padding:10px 8px 4px;border-top:1px solid var(--border-subtle);text-decoration:none;color:var(--text-3)}
.madeby svg{width:22px;height:22px;flex:none}
.madeby .co{font-family:var(--display);font-weight:600;font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--text-2)}
.madeby .co span{color:var(--verdigris)}
.madeby .v{font-family:var(--mono);font-size:10px}
.check{display:flex;gap:10px;align-items:flex-start;padding:10px 12px;border:1px solid var(--border);border-radius:var(--r-md);cursor:pointer;color:var(--text);font-weight:400;margin:0 0 8px}
.check:has(input:checked){border-color:var(--verdigris)}
.check input{width:auto;margin-top:3px}
.check small{display:block;color:var(--text-3);font-size:12px}
nav{display:flex;flex-direction:column;gap:2px}
nav a{display:flex;align-items:center;gap:10px;padding:9px 10px;border-radius:var(--r-md);color:var(--text-2);text-decoration:none;font-weight:500;font-size:14px;white-space:nowrap}
nav a:hover{background:var(--surface);color:var(--text)}
nav a.active{background:var(--surface-2);color:var(--text)}
nav a svg{width:16px;height:16px;stroke:currentColor;fill:none;stroke-width:1.75;stroke-linecap:round;stroke-linejoin:round;flex:none}
nav a .badge{margin-left:auto;background:var(--orange);color:var(--charcoal);font-size:11px;font-weight:600;padding:1px 7px;border-radius:999px}
.spacer{flex:1}
.status{font-family:var(--mono);font-size:11px;color:var(--text-3);padding:8px;border-top:1px solid var(--border-subtle);line-height:1.5}
.status b{color:var(--text-2);font-weight:500}
main{padding:28px 32px 80px;max-width:1280px;width:100%}
@media(max-width:700px){main{padding:20px 16px 80px}}
h1{font-family:var(--display);font-weight:600;font-size:26px;margin:0 0 20px;letter-spacing:.02em}
h2{font-size:17px;font-weight:600;margin:0 0 12px}
h3{font-size:15px;font-weight:600;margin:0 0 8px}
.top{display:flex;align-items:center;justify-content:space-between;gap:16px;margin-bottom:20px;flex-wrap:wrap}
.top h1{margin:0}

/* buttons */
.btn{display:inline-flex;align-items:center;gap:8px;padding:9px 16px;border-radius:var(--r-md);border:1px solid var(--border);background:var(--surface-2);color:var(--text);font-weight:500;font-size:14px;transition:background var(--dur) var(--ease);white-space:nowrap}
.btn:hover{background:var(--btn-hover)}
.btn:active{background:var(--btn-press)}
.btn.primary{background:var(--orange);border-color:var(--orange);color:var(--charcoal);font-weight:600}
.btn.primary:hover{background:var(--orange-hover)}
.btn.primary:active{background:var(--orange-press)}
.btn.secondary{background:var(--verdigris);border-color:var(--verdigris);color:var(--white)}
.btn.secondary:hover{background:var(--verdigris-hover)}
.btn.ghost{background:transparent}
.btn.danger{color:var(--danger);border-color:var(--danger)}
.btn.sm{padding:6px 11px;font-size:13px}
.btn.lg{padding:13px 22px;font-size:16px}
.btn:disabled{opacity:.5;cursor:not-allowed}
.btn svg{width:16px;height:16px;stroke:currentColor;fill:none;stroke-width:1.75;stroke-linecap:round;stroke-linejoin:round}

/* cards */
.card{background:var(--surface);border:1px solid var(--border);border-radius:var(--r-lg);padding:20px;box-shadow:var(--card-shadow)}
.grid{display:grid;gap:16px}
.grid.c2{grid-template-columns:1fr 1fr}.grid.c3{grid-template-columns:repeat(3,1fr)}.grid.c4{grid-template-columns:repeat(4,1fr)}.grid.c5{grid-template-columns:repeat(5,1fr)}
@media(max-width:900px){.grid.c3,.grid.c4,.grid.c5{grid-template-columns:1fr 1fr}}
@media(max-width:600px){.grid.c3,.grid.c4{grid-template-columns:1fr}.grid.c5{grid-template-columns:1fr 1fr}}
@media(max-width:900px){.grid.c2{grid-template-columns:1fr!important}}
.stat{padding:16px 20px}
.stat .n{font-size:34px;font-weight:600;line-height:1.1;font-family:var(--mono)}
.stat .l{font-size:13px;color:var(--text-2);margin-top:4px}
.stat.warn .n{color:var(--warning)}.stat.bad .n{color:var(--danger)}.stat.good .n{color:var(--verdigris-hover)}
button.stat.filter{text-align:left;cursor:pointer;font:inherit;color:inherit;transition:border-color var(--dur) var(--ease)}
button.stat.filter:hover{border-color:var(--border-strong)}
button.stat.filter.on{border-color:var(--orange);box-shadow:0 0 0 1px rgba(255,107,0,.25)}
.muted{color:var(--text-2)}.tiny{font-size:12px;color:var(--text-3)}
.mono{font-family:var(--mono)}
.empty{padding:32px;text-align:center;color:var(--text-3);border:1px dashed var(--border);border-radius:var(--r-lg)}

/* list rows */
.list{display:flex;flex-direction:column;gap:8px}
.item{display:flex;align-items:center;gap:14px;padding:12px 16px;background:var(--surface);border:1px solid var(--border);border-radius:var(--r-lg);cursor:pointer;transition:border-color var(--dur) var(--ease)}
.item:hover{border-color:var(--border-strong)}
.item:focus-visible,.kcard:focus-visible,tr.click:focus-visible,.results div:focus-visible{outline:2px solid var(--orange);outline-offset:1px}
.skip{position:absolute;left:-9999px;top:8px;background:var(--surface);color:var(--text);padding:8px 12px;border:1px solid var(--orange);border-radius:var(--r-md);z-index:100}
.skip:focus{left:8px}
.item .main{flex:1;min-width:0}
.item .t{font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.item .s{font-size:13px;color:var(--text-2);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.item .due{font-family:var(--mono);font-size:12px;color:var(--text-3);white-space:nowrap}
.item .due.over{color:var(--danger)}.item .due.today{color:var(--warning)}
.chip{display:inline-block;font-size:11px;font-weight:500;padding:2px 8px;border-radius:999px;background:var(--surface-2);color:var(--text-2);border:1px solid var(--border);white-space:nowrap}
.chip.stage{border-color:var(--border-strong)}

/* table */
table{width:100%;border-collapse:collapse;font-size:14px}
th,td{text-align:left;padding:10px 12px;border-bottom:1px solid var(--border-subtle);vertical-align:top}
th{font-size:12px;color:var(--text-3);font-weight:500;text-transform:uppercase;letter-spacing:.06em;position:sticky;top:0;background:var(--surface)}
tr.click{cursor:pointer}tr.click:hover td{background:var(--surface-2)}
.tablewrap{overflow-x:auto;background:var(--surface);border:1px solid var(--border);border-radius:var(--r-lg)}
.filters{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:14px}
.filters select{width:auto;min-width:150px;padding:7px 32px 7px 10px;font-size:13px}
.thsort{background:none;border:0;padding:0;font:inherit;color:inherit;text-transform:inherit;letter-spacing:inherit;cursor:pointer}
.thsort.on{color:var(--text)}
.thsort:hover{color:var(--text)}

/* kanban */
.board{display:grid;grid-auto-flow:column;grid-auto-columns:260px;gap:12px;overflow-x:auto;padding-bottom:12px}
.col{background:var(--inset);border:1px solid var(--border-subtle);border-radius:var(--r-lg);padding:10px;min-height:200px}
.col h3{font-size:12px;text-transform:uppercase;letter-spacing:.06em;color:var(--text-2);padding:4px 6px 10px;display:flex;justify-content:space-between}
.col.over{border-color:var(--orange)}
.kcard{background:var(--surface);border:1px solid var(--border);border-radius:var(--r-md);padding:10px 12px;margin-bottom:8px;cursor:grab;font-size:13px}
.kcard:hover{border-color:var(--border-strong)}
.kcard .t{font-weight:600;font-size:14px}
.kcard .s{color:var(--text-2)}
.kcard .d{font-family:var(--mono);font-size:11px;color:var(--text-3);margin-top:4px}
.kcard .d.over{color:var(--danger)}

/* modal */
.modal-bg{position:fixed;inset:0;background:var(--overlay);display:flex;align-items:flex-start;justify-content:center;padding:40px 16px;overflow:auto;z-index:50}
#modal-root2 .modal-bg{z-index:70;align-items:center}
#modal-root2 .modal{max-width:420px}
.modal{background:var(--surface);border:1px solid var(--border);border-radius:var(--r-xl);width:100%;max-width:760px;box-shadow:var(--sh-lg)}
.modal .head{padding:20px 24px 12px;border-bottom:1px solid var(--border-subtle);display:flex;align-items:center;justify-content:space-between;gap:12px}
.modal .head h2{margin:0;font-family:var(--display);font-weight:600;font-size:20px}
.modal .body{padding:24px}
.modal .foot{padding:16px 24px;border-top:1px solid var(--border-subtle);display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap}
.steps{display:flex;gap:6px;font-size:12px;color:var(--text-3)}
.steps span{padding:3px 10px;border-radius:999px;border:1px solid var(--border-subtle)}
.steps span.on{border-color:var(--orange);color:var(--text)}
.steps span.done{color:var(--verdigris-hover);border-color:var(--verdigris)}
.results{border:1px solid var(--border);border-radius:var(--r-md);background:var(--inset);max-height:220px;overflow:auto;margin-top:8px}
.results div{padding:9px 12px;border-bottom:1px solid var(--border-subtle);cursor:pointer;font-size:14px}
.results div:hover{background:var(--surface-2)}
.results .s{font-size:12px;color:var(--text-3)}
.radios{display:flex;flex-direction:column;gap:8px}
.radios label{display:flex;gap:10px;align-items:flex-start;padding:10px 12px;border:1px solid var(--border);border-radius:var(--r-md);cursor:pointer;color:var(--text);font-weight:400;margin:0}
.radios label:has(input:checked){border-color:var(--orange)}
.radios input{width:auto;margin-top:3px}
.radios small{display:block;color:var(--text-3);font-size:12px}
.banner{padding:12px 16px;border-radius:var(--r-lg);border:1px solid var(--border);border-left:3px solid var(--warning);background:var(--surface);font-size:14px;margin-bottom:20px}
.banner.info{border-left-color:var(--info)}.banner.danger{border-left-color:var(--danger);background:var(--danger-surface)}
.toast{position:fixed;bottom:20px;left:50%;transform:translateX(-50%);background:var(--surface-2);border:1px solid var(--border-strong);padding:10px 18px;border-radius:var(--r-md);box-shadow:var(--sh-md);font-size:14px;z-index:60;opacity:0;transition:opacity var(--dur) var(--ease)}
.toast.show{opacity:1}

/* call mode */
.call{display:grid;grid-template-columns:1.1fr .9fr;gap:20px}
@media(max-width:900px){.call{grid-template-columns:1fr}.call>div:nth-child(2){order:-1}}
.outcomes .btn{white-space:normal;text-align:left}
.script p{margin:0 0 14px;font-size:17px;line-height:1.6}
.script .lbl{font-size:11px;text-transform:uppercase;letter-spacing:.08em;color:var(--accent-text);margin:18px 0 6px;font-weight:600}
.script .lbl:first-child{margin-top:0}
.script .ph{font-weight:600;color:var(--text)}
.script .prep{background:var(--inset);border:1px solid var(--border);border-radius:var(--r-md);padding:10px 14px;margin-bottom:14px}
.script .prep p{margin:0;font-size:15px}
.tabs{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:16px}
.tab{background:transparent;border:1px solid var(--border);border-radius:999px;padding:6px 14px;font-size:13px;color:var(--text-2)}
.tab.on{border-color:var(--orange);color:var(--text);background:var(--surface-2)}
.tab.add{border-style:dashed}
.script .ph-missing{background:transparent;color:var(--warning);font-weight:500;border-bottom:1px dashed var(--warning)}
.outcomes{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.outcomes .btn{justify-content:flex-start;padding:12px 14px}
.phone{font-family:var(--mono);font-size:26px;font-weight:500;letter-spacing:.02em}
.kv{display:grid;grid-template-columns:130px 1fr;gap:6px 12px;font-size:14px}
.kv div:nth-child(odd){color:var(--text-3)}
details{border:1px solid var(--border-subtle);border-radius:var(--r-md);padding:8px 12px;margin-top:10px}
summary{cursor:pointer;font-weight:500;font-size:14px;color:var(--text-2)}
.obj{margin:8px 0 4px}
.obj b{display:block;font-size:13px;color:var(--text)}
.obj span{font-size:13px;color:var(--text-2)}
.hist{font-size:13px}
.hist div{padding:8px 0;border-bottom:1px solid var(--border-subtle);display:flex;gap:12px}
.hist .hrow{cursor:pointer;border-radius:var(--r-sm)}.hist .hrow:hover{background:var(--surface-2)}.hist .hrow:focus-visible{outline:2px solid var(--orange)}
.hist .d{font-family:var(--mono);color:var(--text-3);white-space:nowrap}
kbd{font-family:var(--mono);font-size:11px;border:1px solid var(--border-strong);border-radius:4px;padding:1px 5px;color:var(--text-2)}
.funnel td:nth-child(n+2){font-family:var(--mono)}
.pedit textarea,.pedit input{font-size:15px;line-height:1.5;overflow:hidden}
.pitem{display:flex;gap:6px;align-items:flex-start;margin-bottom:8px}
.pitem .btn{padding:8px 10px;flex:none}
.pobj{margin-bottom:14px;padding-bottom:12px;border-bottom:1px solid var(--border-subtle)}
.pobj input{margin-bottom:6px;font-weight:600}
label.btn input{display:none}
.links{display:flex;gap:6px;flex-wrap:wrap;margin:-6px 0 14px}
.links a{font-size:12px;color:var(--text-2);text-decoration:none;border:1px solid var(--border);border-radius:999px;padding:2px 10px}
.links a:hover{border-color:var(--orange);color:var(--text)}
.lbl-link{float:right;font-size:12px;font-weight:400;color:var(--accent-text);text-decoration:none}
.lbl-link:hover{text-decoration:underline}
.hint .ok{color:var(--verdigris-hover)}.hint .warn{color:var(--warning)}.hint .bad{color:var(--danger)}
.tips{margin:4px 0 16px;border-color:var(--border-subtle)}
.tips summary{font-size:12px;color:var(--text-3)}
.tips ul{margin:8px 0 4px;padding-left:18px;font-size:13px;color:var(--text-2)}
.tips li{margin-bottom:4px}
</style>

async function unzip(buf){ // returns {name: Uint8Array}

  if(method===0)out[name]=data;else if(method===8){const ds=new DecompressionStream("deflate-raw");const w=ds.writable.getWriter();w.write(data);w.close();out[name]=new Uint8Array(await new Response(ds.readable).arrayBuffer())}

}

}

 $("#imp").onchange=async e=>{const f=e.target.files[0];if(!f)return;try{let n;if(/\.json$/i.test(f.name)){const d=JSON.parse(await f.text());if(!confirm("Erstatte alle data med denne backupen?"))return;state.leads=d.leads||[];state.activities=d.activities||[];state.settings=d.settings||state.settings;migrate();n=state.leads.length}else if(/\.xlsx$/i.test(f.name))n=await importXlsx(await f.arrayBuffer());else n=importRows(parseCsv(await f.text()));store.save();toast(`Importerte ${n} leads`);renderStatus();viewSettings()}catch(err){toast("Import feilet: "+err.message)}};
 main.querySelectorAll("[data-del]").forEach(b=>b.onclick=()=>{const l=state.leads.find(x=>x.id===b.dataset.del);if(confirm(`Slette ${l.company}?`)){state.leads=state.leads.filter(x=>x.id!==l.id);state.activities=state.activities.filter(a=>a.leadId!==l.id);store.save();viewSettings()}});
 main.querySelectorAll(".item").forEach(el=>el.onclick=e=>{if(e.target.dataset.del)return;location.hash="#/lead/"+el.dataset.id});
 main.querySelectorAll("[data-p]").forEach(el=>el.onchange=()=>{profile()[el.dataset.p]=el.value.trim();store.save()});
 main.querySelectorAll("[data-theme-pref]").forEach(b=>b.onclick=()=>theme.set(b.dataset.themePref));theme.apply();
 main.querySelectorAll("[data-lang]").forEach(b=>{b.onclick=()=>LANG.set(b.dataset.lang);b.classList.toggle("on",b.dataset.lang===lang)});
 $("#wipe").onclick=()=>{if(confirm("Slette alle leads og aktiviteter i nettleseren?")){state.leads=[];state.activities=[];state.settings.seeded=true;try{localStorage.removeItem(APP.slug+"-data");localStorage.removeItem(APP.legacySlug+"-data")}catch(e){}store.dirHandle=null;store.mode="local";store.kvSet("dir",null);renderStatus();viewSettings()}};
}

/* ---------- router ---------- */
function route(){
 const h=location.hash||"#/today";const [_,v,id]=h.split("/");
 renderStatus();
 ({today:viewToday,pipeline:viewPipeline,leads:viewLeads,pitch:viewPitch,lists:viewLists,settings:viewSettings,lead:()=>viewLead(id),call:()=>viewCall(id)}[v]||viewToday)();
 window.scrollTo(0,0);
}
window.addEventListener("hashchange",route);
$("#btn-new").onclick=wizard;
/* Theme preference — mirrors asgard lib/theme.ts + useThemePreference: one stored
   preference ('system'|'dark'|'light', key svart_theme), resolved against
   prefers-color-scheme, followed live while 'system'. */
const theme={
 key:"svart_theme",unpersisted:null,mql:typeof matchMedia==="function"?matchMedia("(prefers-color-scheme: dark)"):null,
 get(){if(this.unpersisted)return this.unpersisted;try{const r=localStorage.getItem(this.key);if(r==="dark"||r==="light"||r==="system")return r}catch(e){}return "system"},
 resolve(p){if(p==="dark"||p==="light")return p;return (!this.mql||this.mql.matches)?"dark":"light"},
 apply(){document.documentElement.dataset.theme=this.resolve(this.get());document.querySelectorAll("[data-theme-pref]").forEach(b=>b.classList.toggle("on",b.dataset.themePref===this.get()))},
 set(p){try{localStorage.setItem(this.key,p);this.unpersisted=null}catch(e){this.unpersisted=p}this.apply()}
};
theme.apply();
if(theme.mql)theme.mql.addEventListener("change",()=>{if(theme.get()==="system")theme.apply()});
document.querySelectorAll("[data-theme-pref]").forEach(b=>b.onclick=()=>theme.set(b.dataset.themePref));
document.querySelectorAll(".side [data-lang]").forEach(b=>b.onclick=()=>LANG.set(b.dataset.lang));applyLangStatic();
document.addEventListener("keydown",e=>{if(e.key.toLowerCase()==="n"&&!e.metaKey&&!e.ctrlKey&&!root.children.length&&!$("#modal-root2").children.length&&!/INPUT|TEXTAREA|SELECT/.test(e.target.tagName)){e.preventDefault();wizard()}});
window.addEventListener("beforeunload",e=>{if(store.dirty){e.preventDefault();e.returnValue=""}});
store.init().catch(e=>console.warn(e)).then(route);
</script>
